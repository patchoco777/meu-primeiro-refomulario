<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <h1 class="tituloPrincipal">
            Meu primeiro Formulario
        </h1>
    </header>
    <main class="principal">
        <form class="formulario">
            <h2 class="tituloFormulario">
                login
            </h2>
            <div class="caixacampo">
                <label for="rotuloCampo" for="">
                    Nome
                </label>
                <input type="text" id="nomecampo" class="campoFormulario" placeholder="seu nome louco">
            </div>
            <div class="caixacampo">
                <label for="emailCampo" class="rotuloCampo">
                    Email
                </label>
                <input type="email" class="rotuloCampo" id="emailCampo" placeholder="digite email">
            </div>
            <div class="caixacampo">
                <label for="senhaCampo">
                    Senha
                </label>
                <input type="Senha" class="rotuloCampo" id="senhaCampo" placeholder="digite senha">
            </div>
            <button class="btnEnviar">Enviar</button>
        </form>
    </main>
</body>

</html>
